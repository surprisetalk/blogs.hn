name: CI

# No paths filter: a required check that never reports blocks the merge.
# Refresh opens its PR with GITHUB_TOKEN, which starts no pull_request run, so Refresh dispatches CI.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint
      - run: deno test --allow-read=blogs.json --allow-env=GITHUB_EVENT_NAME
      - run: node build.js
