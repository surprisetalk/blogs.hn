name: Refresh

on:
  workflow_dispatch:
    inputs:
      all:
        type: boolean
        default: false
        description: refresh every blog
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-net --allow-read=blogs.json --allow-write=blogs.json refresh.ts ${{ inputs.all && '--all' || '' }}
      - run: deno test --allow-read=blogs.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogs.json
          git diff --cached --quiet && exit 0
          git commit -m "🤖"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase || exit 1
            deno test --allow-read=blogs.json || exit 1
          done
          exit 1
