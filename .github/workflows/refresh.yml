name: Refresh

on:
  workflow_dispatch:
    inputs:
      all:
        type: boolean
        default: false
        description: refresh every blog
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          open=$(gh pr list --head refresh --state open --json number --jq length)
          if [ "$open" != 0 ]; then
            git checkout -B refresh origin/refresh
            # The main ruleset requires the branch to be up to date with main.
            git merge --no-edit origin/main
          fi
      - run: deno run --allow-net --allow-read=blogs.json --allow-write=blogs.json refresh.ts ${{ inputs.all && '--all' || '' }}
      - run: deno test --allow-read=blogs.json
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add blogs.json
          git diff --cached --quiet || git commit -m "🤖"
          if [ "$(git branch --show-current)" = refresh ]; then
            [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/refresh)" ] && exit 0
            git push origin refresh
          else
            [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] && exit 0
            git push --force origin HEAD:refresh
            gh pr create --head refresh --title "🤖" --body "Daily refresh of blogs.json. Each run adds a commit until you merge."
          fi
          # A GITHUB_TOKEN push starts no pull_request run, so dispatch CI to report the required check.
          gh workflow run ci.yml --ref refresh
